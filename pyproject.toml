[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argrepair"
version = "0.1.0"
description = "Turn malformed or invalid tool-call arguments into a corrective message the model can act on"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["agents", "llm", "tool-calls", "json", "validation", "repair"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sandeshbagmare/argrepair"
Issues = "https://github.com/sandeshbagmare/argrepair/issues"
Changelog = "https://github.com/sandeshbagmare/argrepair/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/argrepair"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
